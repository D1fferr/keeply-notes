name: keeply_notes
description: "A secure, offline-first mobile note taking application with rich text, reminders, biometric lock, and end-to-end encrypted Google Drive sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Encrypted Database
  drift: ^2.16.0
  sqflite_sqlcipher: ^3.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3

  # Rich Text Editor & Attachments
  flutter_quill: ^10.0.0
  image_picker: ^1.0.7

  # Reminders & Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Security & Biometrics
  local_auth: ^2.2.0

  # Sync & Auth
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # UI & Utilities
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
